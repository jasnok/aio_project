name: 자동 회귀 테스트
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  tests:
    name: ${{ matrix.app }} 외부 연결 차단 테스트
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [BE, FE_Admin, FE_User]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 앱 의존성 설치
        run: python -m pip install -r ${{ matrix.app }}/requirements.txt
      - name: 자동 테스트 실행
        working-directory: ${{ matrix.app }}
        run: python ../scripts/run_tests_offline.py
      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.app }}
          path: .runtime/tests-${{ matrix.app }}.json
