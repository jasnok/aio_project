[project]
name = "tman"
version = "0.1.0"
description = "Read Korean tldr pages in the terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tman = "tman.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
