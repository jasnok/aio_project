name: Multimodal Agent CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: test-key-not-used
      BACKEND_IMAGE: example/backend:test
      FRONTEND_IMAGE: example/frontend:test
      MCP_SERVER_IMAGE: example/mcp-server:test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt
            mcp_server/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Test backend
        working-directory: backend
        run: python -m pytest -q

      - name: Install frontend dependencies
        run: python -m pip install -r frontend/requirements.txt

      - name: Test frontend
        working-directory: frontend
        run: python -m pytest -q

      - name: Install MCP server dependencies
        run: python -m pip install -r mcp_server/requirements.txt

      - name: Test MCP server
        working-directory: mcp_server
        run: python -m pytest -q

      - name: Create non-secret Compose environment files
        run: |
          cp backend/.env.example backend/.env.docker
          cp frontend/.env.example frontend/.env.docker
          cp mcp_server/.env.example mcp_server/.env.docker

      - name: Validate development Compose
        run: docker compose -f compose.yml config --quiet

      - name: Validate release Compose
        run: docker compose -f compose.release.yml config --quiet

      - name: Build service images
        run: docker compose -f compose.yml build
