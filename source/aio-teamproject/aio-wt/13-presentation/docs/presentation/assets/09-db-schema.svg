<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">listings와 listing_images 데이터베이스 설계</title>
  <desc id="desc">청약 공고 테이블과 이미지 테이블의 일대다 관계, 핵심 컬럼, 제약조건을 설명하는 발표용 그림</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 42px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #0f172a; }
      .subtitle { font: 400 21px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #475569; }
      .table-title { font: 700 30px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #ffffff; }
      .table-sub { font: 400 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #dbeafe; }
      .group-title { font: 700 19px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #1d4ed8; }
      .field { font: 500 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #1e293b; }
      .field-sub { font: 400 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #64748b; }
      .relation { font: 700 28px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #1d4ed8; }
      .relation-sub { font: 500 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #475569; }
      .constraint { font: 600 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #ffffff; }
      .badge { font: 700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #1d4ed8; }
      .takeaway { font: 700 18px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #0f172a; }
      .takeaway-sub { font: 400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <circle cx="1460" cy="-20" r="220" fill="#dbeafe" opacity="0.65"/>
  <circle cx="80" cy="880" r="180" fill="#e0f2fe" opacity="0.55"/>

  <text x="70" y="74" class="title">데이터베이스 설계: 공고 1개에 이미지 여러 장</text>
  <text x="70" y="112" class="subtitle">한 listings 행 = 같은 공고의 ‘주택 1개 + 신청유형(면적) 1개’</text>
  <rect x="1360" y="54" width="168" height="42" rx="21" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1444" y="81" text-anchor="middle" class="badge">발표용 요약</text>

  <!-- listings -->
  <rect x="70" y="155" width="840" height="610" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M94 155 H886 Q910 155 910 179 V236 H70 V179 Q70 155 94 155 Z" fill="#2563eb"/>
  <text x="105" y="196" class="table-title">listings</text>
  <text x="105" y="222" class="table-sub">청약정보의 비교 기준을 표준 컬럼으로 저장</text>
  <rect x="767" y="177" width="112" height="38" rx="19" fill="#ffffff" opacity="0.18"/>
  <text x="823" y="202" text-anchor="middle" class="constraint">기준 테이블</text>

  <rect x="100" y="265" width="375" height="175" rx="16" fill="#f8fafc" stroke="#dbeafe"/>
  <text x="125" y="300" class="group-title">① 식별·공고</text>
  <text x="125" y="334" class="field">id <tspan class="field-sub">BIGINT · PK</tspan></text>
  <text x="125" y="368" class="field">title <tspan class="field-sub">공고명</tspan></text>
  <text x="125" y="402" class="field">housing_name <tspan class="field-sub">주택명·신청유형</tspan></text>

  <rect x="505" y="265" width="375" height="175" rx="16" fill="#f8fafc" stroke="#dbeafe"/>
  <text x="530" y="300" class="group-title">② 주택·위치</text>
  <text x="530" y="334" class="field">area_sqm <tspan class="field-sub">전용면적 ㎡</tspan></text>
  <text x="530" y="368" class="field">recruitment_count <tspan class="field-sub">모집 호수</tspan></text>
  <text x="530" y="402" class="field">location · detail_address</text>

  <rect x="100" y="462" width="375" height="175" rx="16" fill="#f8fafc" stroke="#dbeafe"/>
  <text x="125" y="497" class="group-title">③ 비용·신청기간</text>
  <text x="125" y="531" class="field">deposit <tspan class="field-sub">보증금</tspan></text>
  <text x="125" y="565" class="field">monthly_rent <tspan class="field-sub">월 임대료</tspan></text>
  <text x="125" y="599" class="field">application_start / end_date</text>

  <rect x="505" y="462" width="375" height="175" rx="16" fill="#f8fafc" stroke="#dbeafe"/>
  <text x="530" y="497" class="group-title">④ 설명·출처·대표 이미지</text>
  <text x="530" y="531" class="field">description <tspan class="field-sub">자격·주의사항</tspan></text>
  <text x="530" y="565" class="field">source_url <tspan class="field-sub">공식 원문</tspan></text>
  <text x="530" y="599" class="field">image_url <tspan class="field-sub">대표 이미지</tspan></text>

  <rect x="100" y="666" width="780" height="66" rx="14" fill="#1e3a8a"/>
  <text x="490" y="693" text-anchor="middle" class="constraint">DB CHECK 제약조건</text>
  <text x="490" y="718" text-anchor="middle" class="constraint">면적·모집인원 &gt; 0 · 보증금·월세 ≥ 0 · 신청 종료일 ≥ 시작일</text>

  <!-- relationship -->
  <line x1="928" y1="435" x2="1040" y2="435" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <circle cx="945" cy="399" r="26" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="945" y="409" text-anchor="middle" class="relation">1</text>
  <circle cx="1020" cy="399" r="26" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1020" y="409" text-anchor="middle" class="relation">N</text>
  <text x="982" y="480" text-anchor="middle" class="relation-sub">has</text>

  <!-- listing_images -->
  <rect x="1055" y="215" width="475" height="500" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M1079 215 H1506 Q1530 215 1530 239 V296 H1055 V239 Q1055 215 1079 215 Z" fill="#0f766e"/>
  <text x="1090" y="256" class="table-title">listing_images</text>
  <text x="1090" y="282" class="table-sub" style="fill:#ccfbf1">이미지 URL과 표시 순서를 분리 저장</text>

  <text x="1095" y="345" class="field">id <tspan class="field-sub">BIGINT · PK</tspan></text>
  <line x1="1095" y1="363" x2="1490" y2="363" stroke="#e2e8f0"/>
  <text x="1095" y="403" class="field">listing_id <tspan class="field-sub">FK → listings.id</tspan></text>
  <line x1="1095" y1="421" x2="1490" y2="421" stroke="#e2e8f0"/>
  <text x="1095" y="461" class="field">image_url <tspan class="field-sub">Storage 공개 URL</tspan></text>
  <line x1="1095" y1="479" x2="1490" y2="479" stroke="#e2e8f0"/>
  <text x="1095" y="519" class="field">sort_order <tspan class="field-sub">0 = 대표 이미지</tspan></text>
  <line x1="1095" y1="537" x2="1490" y2="537" stroke="#e2e8f0"/>
  <text x="1095" y="577" class="field">created_at <tspan class="field-sub">등록 시각</tspan></text>

  <rect x="1090" y="610" width="405" height="76" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1112" y="638" class="group-title" style="fill:#047857">관계 안전장치</text>
  <text x="1112" y="664" class="field-sub">UNIQUE (listing_id, sort_order) · ON DELETE CASCADE</text>

  <!-- takeaways -->
  <rect x="70" y="804" width="450" height="68" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="100" y="833" class="takeaway">비교 가능한 표준 스키마</text>
  <text x="100" y="856" class="takeaway-sub">공고마다 다른 표현을 같은 컬럼으로 정리</text>

  <rect x="575" y="804" width="450" height="68" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="605" y="833" class="takeaway">공고당 이미지 최대 20장</text>
  <text x="605" y="856" class="takeaway-sub">위치도·평면도·외관을 순서대로 관리</text>

  <rect x="1080" y="804" width="450" height="68" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1110" y="833" class="takeaway">기존 대표 이미지 호환</text>
  <text x="1110" y="856" class="takeaway-sub">listings.image_url = sort_order 0</text>
</svg>
